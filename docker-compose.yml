# Weave — full stack.
#
#   docker compose up --build
#     frontend -> http://localhost:3000
#     backend  -> http://localhost:8001  (docs at /docs)
#
# DEFAULT NOW INCLUDES POSTGRES AND REDIS.
#
# They used to be behind the "full" profile, so the default `docker compose up`
# ran on SQLite with per-process rate limits — a configuration that is fine for
# one person and quietly wrong for a class. SQLite has exactly one writer, so two
# students sending a message at the same moment serialise and a third waits
# behind both; per-process rate limits multiply by the worker count, so the
# limit in the settings is not the limit in effect. Neither of those announces
# itself. They present as "Weave is slow today".
#
# A deployment default should be the shape you actually deploy. The zero-service
# boot still exists and is still one command — it is just no longer what you get
# by accident:
#
#   WEAVE_DATABASE_URL=sqlite:///./var/weave.db WEAVE_REDIS_URL= #     docker compose up backend frontend --build
#
# Optional capability tiers stay behind their profiles:
#   --profile deep         search, headless Chrome, rendering
#   --profile voice        server-side speech
#   --profile full         the Celery worker for background jobs
#   --profile build-images build the workspace sandbox image

services:
  backend:
    build: ./backend
    image: weave-backend:local
    ports:
      # Host 8001 -> container 8000 (8000 on the host may be taken by another app).
      - "127.0.0.1:8001:8000"
    environment:
      WEAVE_ENVIRONMENT: ${WEAVE_ENVIRONMENT:-dev}
      WEAVE_DEBUG: ${WEAVE_DEBUG:-true}
      WEAVE_SECRET_KEY: ${WEAVE_SECRET_KEY:-dev-insecure-change-me-in-production-please-0123456789}
      WEAVE_CORS_ORIGINS: '${WEAVE_CORS_ORIGINS:-["http://localhost:3000"]}'
      # LLM backend: auto | ollama | anthropic | offline
      WEAVE_LLM_BACKEND: ${WEAVE_LLM_BACKEND:-auto}
      # Reach an Ollama server running on the host from inside the container.
      WEAVE_OLLAMA_HOST: ${WEAVE_OLLAMA_HOST:-http://host.docker.internal:11434}
      WEAVE_OLLAMA_MODEL: ${WEAVE_OLLAMA_MODEL:-gpt-oss:120b-cloud}
      WEAVE_OLLAMA_MODEL_FAST: ${WEAVE_OLLAMA_MODEL_FAST:-}
      WEAVE_OLLAMA_MODEL_FRONTIER: ${WEAVE_OLLAMA_MODEL_FRONTIER:-}
      # Optional: use Ollama for retrieval embeddings too (needs the embed model pulled).
      WEAVE_OLLAMA_USE_EMBEDDINGS: ${WEAVE_OLLAMA_USE_EMBEDDINGS:-false}
      WEAVE_OLLAMA_EMBED_MODEL: ${WEAVE_OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # Provide a real key to use Claude instead; omit to run the offline engine.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Deep-capability services (populated when the "deep" profile is up; empty
      # otherwise, so the tools simply report themselves unavailable).
      WEAVE_SEARXNG_URL: ${WEAVE_SEARXNG_URL:-}
      WEAVE_BROWSERLESS_URL: ${WEAVE_BROWSERLESS_URL:-}
      WEAVE_RENDER_URL: ${WEAVE_RENDER_URL:-}
      WEAVE_CLICKHOUSE_URL: ${WEAVE_CLICKHOUSE_URL:-}
      WEAVE_ANALYSIS_EXECUTION_ENABLED: ${WEAVE_ANALYSIS_EXECUTION_ENABLED:-true}
      # Optional server-side voice. Empty (the default) means the BROWSER does
      # both recognition and synthesis with the Web Speech API — no models, no
      # GPU, works on a mid-range Android. Bring these up with --profile voice
      # for much better Kiswahili at a considerable resource cost.
      WEAVE_STT_URL: ${WEAVE_STT_URL:-}
      WEAVE_TTS_URL: ${WEAVE_TTS_URL:-}
      # Background jobs, shared rate-limit buckets, cache. Defaults to the redis
      # service below; set WEAVE_REDIS_URL= (empty) to run without it, at the
      # cost of rate limits that only bind within one worker process.
      WEAVE_REDIS_URL: ${WEAVE_REDIS_URL-redis://redis:6379/0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      WEAVE_SMS_PROVIDER: ${WEAVE_SMS_PROVIDER:-log}
      WEAVE_AT_USERNAME: ${WEAVE_AT_USERNAME:-}
      WEAVE_AT_API_KEY: ${WEAVE_AT_API_KEY:-}
      WEAVE_WA_VERIFY_TOKEN: ${WEAVE_WA_VERIFY_TOKEN:-weave-verify}
      WEAVE_WA_APP_SECRET: ${WEAVE_WA_APP_SECRET:-}
      WEAVE_WA_TOKEN: ${WEAVE_WA_TOKEN:-}
      WEAVE_WA_PHONE_ID: ${WEAVE_WA_PHONE_ID:-}
      # Postgres + pgvector, the deployment database. Set this to a sqlite:///
      # URL to fall back to the single-file, single-writer development database.
      WEAVE_DATABASE_URL: ${WEAVE_DATABASE_URL-postgresql+psycopg://weave:weave@postgres:5432/weave}
      # Pool sizing is per WORKER, and Postgres' own default max_connections is
      # 100 — so workers x (pool + overflow) has to stay under it.
      WEAVE_DB_POOL_SIZE: ${WEAVE_DB_POOL_SIZE:-10}
      WEAVE_DB_MAX_OVERFLOW: ${WEAVE_DB_MAX_OVERFLOW:-20}
      # --- developer workspace (the SECOND sandbox) ---
      # Where the assistant builds software: network on, dependencies
      # installable, results packaged as a tarball. Set to false before exposing
      # Weave to people you do not trust — every verified user can run commands
      # in a container on this host.
      WEAVE_WORKSPACE_ENABLED: ${WEAVE_WORKSPACE_ENABLED:-false}
      WEAVE_WORKSPACE_IMAGE: ${WEAVE_WORKSPACE_IMAGE:-weave-workspace:latest}
    depends_on:
      # `service_healthy`, not just `service_started`. Postgres accepts a TCP
      # connection several seconds before it will answer a query, so starting the
      # backend on "started" means the first boot reliably fails and the
      # container restarts — which reads as a broken image rather than a race.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      # Lets host.docker.internal resolve to the host on Linux too (already works
      # on Docker Desktop for Mac/Windows).
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_var:/app/var
      # A NAMED VOLUME, not a host bind.
      #
      # The workspace container runs as uid 1000 and has to write into this
      # directory — that is what `npm install`, a build and a test run all do.
      # On a Docker Desktop (Windows/macOS) host bind, ownership is synthesised:
      # everything appears as root:root 0755 and chown is silently a no-op, so
      # every write from inside the container fails with EACCES. A named volume
      # is real ext4 inside the VM, so ownership works and the container can stay
      # non-root. The service mounts the per-project subdirectory of this same
      # volume into each workspace container.
      - workspaces:/app/var/workspaces
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      WEAVE_API_BASE: http://backend:8000
      # Where the BROWSER opens WebSockets (live voice, screen share, the shared
      # canvas). Next.js route handlers proxy HTTP but not upgrade requests, so
      # sockets go straight to the API — which means this has to be an address
      # the browser can reach, not the internal service name. Override it when
      # deploying behind a domain, e.g. wss://weave.example.tz.
      WEAVE_PUBLIC_WS_BASE: ${WEAVE_PUBLIC_WS_BASE:-ws://localhost:8001}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    # pgvector image so the vector extension is available (architecture §2).
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: weave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weave}
      POSTGRES_DB: weave
    # Bound to loopback. The previous "5432:5432" published the database on every
    # interface of the host with the password `weave` — on a VPS that is an open
    # database, and nothing about the line said so. Compose services reach it by
    # service name and need no published port at all; this keeps psql from the
    # host working without exposing it to the internet.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave -d weave"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    # Same reasoning as Postgres above: Redis has no password here, so it must
    # not be reachable from outside the host.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    # Celery worker for background jobs (ingestion, heavy analysis, re-summarize).
    image: weave-backend:local
    profiles: ["full"]
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info", "--concurrency=${WEAVE_CELERY_CONCURRENCY:-4}"]
    environment:
      WEAVE_REDIS_URL: redis://redis:6379/0
      WEAVE_DATABASE_URL: ${WEAVE_DATABASE_URL:-postgresql+psycopg://weave:weave@postgres:5432/weave}
      WEAVE_OLLAMA_HOST: ${WEAVE_OLLAMA_HOST:-http://host.docker.internal:11434}
      WEAVE_OLLAMA_MODEL: ${WEAVE_OLLAMA_MODEL:-gpt-oss:120b-cloud}
      WEAVE_OLLAMA_MODEL_FAST: ${WEAVE_OLLAMA_MODEL_FAST:-}
      WEAVE_OLLAMA_MODEL_FRONTIER: ${WEAVE_OLLAMA_MODEL_FRONTIER:-}
      # Four prefork children, each with at most three DB connections, keeps the
      # worker below 12 connections. The API may then use its 30-connection peak
      # without exhausting a stock Postgres max_connections=100 deployment.
      WEAVE_DB_POOL_SIZE: ${WEAVE_WORKER_DB_POOL_SIZE:-2}
      WEAVE_DB_MAX_OVERFLOW: ${WEAVE_WORKER_DB_MAX_OVERFLOW:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_var:/app/var

  # ---- Deep-capability services (profile: deep) --------------------------
  # Start with:  docker compose --profile deep up -d
  # then point the backend at them (see .env: WEAVE_SEARXNG_URL=http://searxng:8080 etc.)

  searxng:
    image: searxng/searxng:latest@sha256:d0a4ca04e68c6d57fe45509ad5a6b10c890350724762ade3abea5363571aa29a
    profiles: ["deep"]
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    volumes:
      # Bind-mount our settings.yml (enables the JSON API + disables the limiter).
      - ./searxng:/etc/searxng:ro

  browserless:
    # Headless-Chrome pool for JS-rendered fetches + screenshots + PDF.
    image: ghcr.io/browserless/chromium:latest
    profiles: ["deep"]
    ports:
      - "127.0.0.1:3001:3000"
    shm_size: "1gb"          # Chromium needs more than the default 64MB /dev/shm
    environment:
      CONCURRENT: "4"
      TOKEN: ""

  render:
    # Node render-sandbox: AI specs -> charts / Three.js / Babylon.js scenes /
    # decks (see render-service/). Babylon bundles are large, so this image
    # takes a few minutes to build the first time.
    build: ./render-service
    profiles: ["deep"]
    ports:
      - "127.0.0.1:3100:3100"

  # ---- optional server-side voice (profile: voice) ------------------------
  # The DEFAULT voice path needs none of this: the browser's Web Speech API does
  # recognition and synthesis on the device, which is why live voice works out of
  # the box on a phone. These two exist for deployments that want much better
  # Kiswahili and can afford the models.
  #
  #   docker compose --profile deep --profile voice up -d
  #   WEAVE_STT_URL=http://whisper:8080 WEAVE_TTS_URL=http://piper:5000 ...
  #
  # First boot downloads a model, so give it a few minutes before it answers.
  whisper:
    image: ghcr.io/ggerganov/whisper.cpp:main
    profiles: ["voice"]
    command: ["./server", "-m", "/models/ggml-base.bin", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - whisper_models:/models

  piper:
    image: lscr.io/linuxserver/piper:latest
    profiles: ["voice"]
    environment:
      PIPER_VOICE: ${PIPER_VOICE:-en_GB-alba-medium}
      PIPER_LENGTH: "1.0"
    ports:
      - "127.0.0.1:10200:10200"
    volumes:
      - piper_data:/config

  # ---- developer-workspace image (built, never run as a service) ----------
  # `docker compose --profile build-images build workspace-image` produces the
  # image the backend starts per command. It is defined here so the build is one
  # command rather than a README instruction people miss.
  workspace-image:
    build: ./workspace-image
    image: weave-workspace:latest
    profiles: ["build-images"]
    command: ["true"]

  minio:
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    # Local S3 contract testing only. It is not required by the normal deep
    # rendering/search profile and should not consume memory by accident.
    profiles: ["object-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: weave
      MINIO_ROOT_PASSWORD: weave-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  qdrant:
    image: qdrant/qdrant:latest@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    # Reserved experiment; production retrieval currently uses pgvector.
    profiles: ["experimental-scale"]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  clickhouse:
    image: clickhouse/clickhouse-server:latest@sha256:d73903d1b61dfe825fc3810542f252966f33d3fd8efb3b3edcbbafb46b524b04
    # Reserved experiment; the warehouse tool currently uses DuckDB.
    profiles: ["experimental-scale"]
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  backend_var:
  # Per-project developer workspaces. Shared by name into each
  # workspace container via volume-subpath, so the model's files and
  # the commands it runs see the same directory with real ownership.
  workspaces:
  pg_data:
  minio_data:
  qdrant_data:
  clickhouse_data:
  whisper_models:
  piper_data:
